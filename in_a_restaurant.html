<!DOCTYPE html>
<html lang="UA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>NOIR CUISINE Доставка</title>
</head>
<body>
    <div class="header">
        <h1>NOIR CUISINE</h1>
        <div>
            <a href="index.html">Меню</a>
            <a href="basket.html"><i class="bi bi-basket2-fill"></i></a>
        </div>
    </div>
    <h1 class="h1-on-last">Оформлення замовлення</h1>
    <div class="order-card">
        <div class="tabs">
            <a class="tab active" href="in_a_restaurant.html">В РЕСТОРАНІ</a>
            <a class="tab" href="delivery.html">ДОСТАВКА</a>
        </div>
        <form>
            <div class="input-group">
                <label for="name">Ім'я:</label>
                <input type="text" placeholder="Ваше ім'я" required>
            </div>
            <div class="input-group">
                <label for="phone">Телефон:</label>
                <input type="tel" placeholder="+380 (__) ___ __ __" required>
            </div>
            <div class="input-group">
                <label>Оберіть столик:</label>
                <select>
                    <option value="1">Столик 1</option>
                    <option value="2">Столик 2</option>
                    <option value="3">Столик 3</option>
                    <option value="4">Столик 4</option>
                    <option value="5">Столик 5</option>
                    <option value="6">Столик 6</option>
                    <option value="7">Столик 7</option>
                    <option value="8">Столик 8</option>
                    <option value="9">Столик 9</option>
                    <option value="10">Столик 10</option>
                </select>
            </div>
            <div class="total-section">
                <span class="total-label">Загальна сума:</span>
                <span class="total-amount">2650 ₴</span>
            </div>
            <a class="confirm-btn">Підтвердити замовлення</a>
        </form>
    </div>
    <a href="index.html" class="back-link">Повернутися до меню</a>
    <footer class="footer">
        <div class="footer-content">
            <h2 class="footer-title">NOIR CUISINE</h2>
            <p class="footer-description">Мистецтво смаку в кожній деталі</p>
        </div>
    </footer>
    <script src="cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let totalAmountEl = document.querySelector('.total-amount');
            if (totalAmountEl && typeof getCartTotal === 'function') {
                totalAmountEl.textContent = `${getCartTotal()} ₴`;
            }

            let confirmBtn = document.querySelector('.confirm-btn');
            if (!confirmBtn) return;

            let nameInput = document.querySelector('input[type="text"]');
            let phoneInput = document.querySelector('input[type="tel"]');
            let tableSelect = document.querySelector('select');

            confirmBtn.addEventListener('click', (event) => {
                event.preventDefault();

                let name = nameInput?.value.trim();
                let phone = phoneInput?.value.trim();
                let table = tableSelect?.value;
                let total = getCartTotal();

                let phonePattern = /^\+380\s?\(?\d{2,3}\)?\s?\d{3}\s?\d{2}\s?\d{2}$/;

                if (!name || !phone || !table) {
                    showToast('Будь ласка, заповніть всі поля.');
                    return;
                }

                if (!phonePattern.test(phone)) {
                    showToast('Введіть коректний номер телефону у форматі +380 XX XXX XX XX.');
                    return;
                }

                if (total <= 0) {
                    showToast('Ваш кошик порожній. Додайте щось до замовлення.');
                    return;
                }

                showToast('Дякуємо! Ваше замовлення успішно оформлено. Скоро зателефонуємо для підтвердження.');
                localStorage.removeItem('cart');
                updateCartBadge();

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 5000);
            });
        });
    </script>
</body>
</html>
